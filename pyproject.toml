[project]
name = "status-page-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy==2.0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server", "src/client"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
server = "server.main:main"
client = "client.main:main"
